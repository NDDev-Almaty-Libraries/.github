# Moves main forward to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned library selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@b95bec1ae2af1b3bf13b88c41a86c9b8ddeb9a16 # v0.6.149
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
