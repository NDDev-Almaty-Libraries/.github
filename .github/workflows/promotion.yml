# Moves main forward to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned library selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@6e3000e74bc68c0b01ed4d1f7e5b85132e5f4493 # v0.6.75
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
