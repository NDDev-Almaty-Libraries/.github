# Moves main forward to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned library selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@e2cc2ac3493652bcc0741c6aa999f3e315f705a9 # v0.6.77
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
