# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@03d53ec146797bc27d7b8b37abbf766ab82041b6 # v0.6.81
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
