# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6d2cdfdf3edba130dada52a8046b8a8e9f089204 # v0.6.97
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
