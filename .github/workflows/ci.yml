# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
