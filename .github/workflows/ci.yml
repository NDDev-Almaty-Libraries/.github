# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@cafb9917b974ed4ef3af483b3417cbe82b776a99 # v0.6.42
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
