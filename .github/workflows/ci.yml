# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6038ed01530c24ab5f16390c7b2daab8c85fc7c5 # v0.6.29
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
