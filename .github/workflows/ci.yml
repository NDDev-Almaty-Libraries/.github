# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@356a5b38a8fe5b4ac9d11266e42e6196dc6bde49 # v0.6.68
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
