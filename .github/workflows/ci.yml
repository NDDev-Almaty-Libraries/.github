# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@b95bec1ae2af1b3bf13b88c41a86c9b8ddeb9a16 # v0.6.149
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
