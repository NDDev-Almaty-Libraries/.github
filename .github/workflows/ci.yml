# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@da7d6fd99e4fe8ed90e59a970043bde90486190d # v0.6.103
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
