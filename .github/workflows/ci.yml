# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@5d79473744e27467565d5932c4d9366125b856a6 # v0.6.35
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
