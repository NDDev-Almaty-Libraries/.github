# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
