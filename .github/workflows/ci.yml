# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
