# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6e3000e74bc68c0b01ed4d1f7e5b85132e5f4493 # v0.6.75
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
