# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@5c97e5eb7e7a95706097e999bb444bf313dfd381 # v0.6.40
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
