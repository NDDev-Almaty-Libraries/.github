# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c561c2c5e1cd62022ed6f41b9424be35e6fa3824 # v0.6.71
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
